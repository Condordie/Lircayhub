name: lircayhub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  vibration: ^3.2.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/font/Nunito-VariableFont_wght.ttf
        - asset: assets/font/Nunito-Italic-VariableFont_wght.ttf
          style: italic